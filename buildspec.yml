version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing SAM CLI..."
      - pip install aws-sam-cli

  build:
    commands:
      - echo "Starting SAM build..."
      - sam build --config-file /dev/null

      - echo "After sam build:"
      - ls -la

      - echo "Running sam package..."
      - sam package \
          --config-file /dev/null \
          --s3-bucket upload-notification-artifacts \
          --output-template-file packaged.yaml

      - echo "After sam package:"
      - ls -la

artifacts:
  files:
    - packaged.yaml
