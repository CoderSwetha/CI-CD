version: 0.2
 
phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - python --version
      - pip --version
      - pip install --upgrade pip
      - pip install aws-sam-cli
 
  build:
    commands:
      - sam --version
      - sam build
      - sam package \
          --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-apxr1gtqrtxm \
          --output-template-file packaged.yaml
 
artifacts:
  files:
    - packaged.yaml