version: 0.2

env:
  variables:
    S3_BUCKET: upload-notification-artifacts

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install aws-sam-cli

  pre_build:
    commands:
      - echo "Running tests..."
      # optional test step
      # - pytest

  build:
    commands:
      - echo "Building SAM app..."
      - sam build

      - echo "Packaging Lambda..."
      - sam package \
          --s3-bucket $S3_BUCKET \
          --output-template-file packaged.yaml

artifacts:
  files:
    - packaged.yaml
