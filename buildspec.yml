version: 0.2
 
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --upgrade pip
      - pip install aws-sam-cli
 
  build:
    commands:
      - sam build
      - sam package --resolve-s3 --output-template-file packaged.yaml
      - echo "Files:"
      - ls -la
 
artifacts:
  base-directory: .
  files:
    - packaged.yaml