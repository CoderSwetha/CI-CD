version: 0.2

env:
  variables:
    S3_BUCKET: upload-notification-artifacts

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --upgrade pip
      - pip install aws-sam-cli

  build:
    commands:
      - sam build
      - sam package \
          --s3-bucket $S3_BUCKET \
          --output-template-file package.yaml

artifacts:
  files:
    - package.yaml
