version: 0.2
 
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python --version
      - pip --version
      - pip install --upgrade pip
      - pip install aws-sam-cli
 
 build:
    commands:
      - sam build
      - sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --stack-name upload-notification --capabilities CAPABILITY_IAM --region ap-south-1
      
artifacts:
  files:
      - '**/*'