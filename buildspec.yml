version: 0.2
 
phases:
  install:
    commands:
      - pip install aws-sam-cli --upgrade --user
      - export PATH=$PATH:/root/.local/bin
      - sam --version
 
  build:
    commands:
      - sam build
      - sam package --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-apxrlgtqrtxm --output-template-file packaged.yaml
 
artifacts:
  files:
    - packaged.yaml