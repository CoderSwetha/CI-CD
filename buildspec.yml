version: 0.2
 
phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - pip install aws-sam-cli
 
  build:
    commands:
      - sam build
      - sam package --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-apxrlgtqrtxm --output-template-file packaged.yaml
 
artifacts:
  files:
    - packaged.yaml